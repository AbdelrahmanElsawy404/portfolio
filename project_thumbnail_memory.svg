<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Mem0 Customer Memory</title><desc id="desc">Save customer facts and retrieve context in a new support session.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102636"/><stop offset="1" stop-color="#112b2b"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g fill="none" stroke="#2d6864" stroke-width="2"><path d="M270 240h65m130 0h65"/><path d="m325 232 10 8-10 8m195-16 10 8-10 8"/></g>
  <text x="50" y="70" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">MEM0 CUSTOMER MEMORY</text>
  <text x="50" y="124" fill="#f0fdfa" font-family="Arial,sans-serif" font-weight="700" font-size="36">New session. Same context.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="50" y="184" width="220" height="112" rx="16" fill="#153a3b" stroke="#37766e"/>
    <text x="160" y="230" fill="#f0fdfa" font-size="23">Save facts</text><text x="160" y="265" fill="#b0d7cf" font-size="17">Customer preferences</text>
    <rect x="335" y="184" width="130" height="112" rx="16" fill="#214f49" stroke="#6ee7b7"/>
    <text x="400" y="234" fill="#f0fdfa" font-size="25" font-weight="700">Mem0</text><text x="400" y="266" fill="#b0d7cf" font-size="16">Memory store</text>
    <rect x="530" y="184" width="220" height="112" rx="16" fill="#153a3b" stroke="#37766e"/>
    <text x="640" y="230" fill="#f0fdfa" font-size="23">Retrieve context</text><text x="640" y="265" fill="#b0d7cf" font-size="17">Relevant support facts</text>
  </g>
  <text x="50" y="375" fill="#b0d7cf" font-family="Arial,sans-serif" font-size="19">Python · Streamlit · Qdrant · SQLite</text>
</svg>